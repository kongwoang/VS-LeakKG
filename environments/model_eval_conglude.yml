name: conglude
channels:
  - pytorch
  - nvidia
  - pyg
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pytorch=2.1.2
  - torchvision=0.16.2
  - torchaudio=2.1.2
  - pytorch-cuda=12.1
  - rdkit=2024.03.5
  - pyg=2.4.0
  - libgcc-ng        # Linux-only; ignore on Windows
  - pip
  - pip:
      - torch-scatter@https://data.pyg.org/whl/torch-2.4.1+cu121.html
      - -e ../external/model_eval/conglude
# Source: external/model_eval/conglude/setup_env.sh (verbatim)
# Disk footprint estimate: ~5 GB (pytorch + cuda runtime + pyg)
# Build duration: 10–20 minutes on a fast connection
# GPU: required for practical inference (CPU works but is 50–100× slower)
